# Nginx для новой системы: new.cfo-avmv.ru → приложение на 127.0.0.1:8001.
# Отдельный файл; конфиг старой системы (cfo-avmv.ru) не затрагивается.
# HTTPS (порт 443 и сертификат) добавит certbot — см. deploy/README.md.

server {
    listen 80;
    server_name new.cfo-avmv.ru;

    # Загрузка файлов (выписки, Excel) — до 20 МБ
    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
