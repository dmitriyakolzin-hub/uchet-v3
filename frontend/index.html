<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Учёт v3</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main class="card" id="login-view" hidden>
    <h1>Учёт v3</h1>
    <form id="login-form" autocomplete="on">
      <label>Логин
        <input name="login" autocomplete="username" required autofocus>
      </label>
      <label>Пароль
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <p class="error" id="login-error" role="alert"></p>
      <button type="submit">Войти</button>
    </form>
  </main>

  <main class="card" id="home-view" hidden>
    <h1>Учёт v3</h1>
    <p>Вы вошли как <strong id="user-name"></strong>.</p>
    <p class="muted">Система в разработке: этап 0 — каркас и безопасность.</p>
    <button type="button" id="logout">Выйти</button>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
