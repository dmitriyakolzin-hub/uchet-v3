<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Учёт v3</title>
  <link rel="stylesheet" href="/vendor/tabulator/tabulator_simple.min.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main class="card login" id="login-view" hidden>
    <h1>Учёт v3</h1>
    <form id="login-form" autocomplete="on">
      <label>Логин
        <input name="login" autocomplete="username" required>
      </label>
      <label>Пароль
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <p class="error" id="login-error" role="alert"></p>
      <button type="submit">Войти</button>
    </form>
  </main>

  <div class="layout" id="app-view" hidden>
    <aside class="sidebar">
      <div class="brand">Учёт v3</div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <span id="user-name"></span>
        <button type="button" class="secondary" id="logout">Выйти</button>
      </div>
    </aside>
    <main class="content" id="view"></main>
  </div>

  <script src="/vendor/tabulator/tabulator.min.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
